name: Feature request
description: 建议新的审核规则、题型、脚本或工作流改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和问题
      description: 说明当前工作流为什么不能充分处理该场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明输入、步骤、输出、证据要求和失败边界。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 所属区域
      options:
        - SKILL.md 工作流
        - 十二维评分
        - 题型专项规则
        - 证据政策
        - 文件处理脚本
        - 报告输出
        - 盲测与一致性
        - 开发与发布
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 建议的验证方法
      description: 给出不包含真实论文的正向和拒绝测试思路。
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 该建议不会把内部评分描述为官方成绩或获奖预测。
          required: true
        - label: 示例不包含未授权论文、身份信息或盲测答案。
          required: true
